ShadowQuality = Unchanged

## [GPU] Maximum realtime shadow distance in metres; kept if the game already uses less. -1 = unchanged.
# Setting type: Single
# Default value: 30
# Acceptable value range: From -1 to 1000
ShadowDistanceLimit = 30

## [GPU] Upper limit for shadow-map resolution (built-in pipeline only; no effect under URP).
# Setting type: ShadowResolutionLimit
# Default value: Unchanged
# Acceptable values: Unchanged, Low, Medium, High
ShadowResolution = Unchanged

## [GPU] Maximum shadow cascades (1, 2 or 4; built-in pipeline or URP asset). Kept if the game already uses fewer. -1 = unchanged.
# Setting type: Int32
# Default value: 2
# Acceptable value range: From -1 to 4
ShadowCascadesLimit = 2

## [GPU] MSAA samples (0, 2, 4, 8). -1 = unchanged. A cap on both pipelines (never raised). Under URP it applies at once and reallocates the eye textures (brief hitch); with the built-in pipeline some VR runtimes only pick it up after a restart. The dashboard shows the eye-texture MSAA in use.
# Setting type: Int32
# Default value: -1
# Acceptable value range: From -1 to 8
MsaaSamples = -1

## [GPU] Anisotropic texture filtering mode.
# Setting type: AnisotropicMode
# Default value: Unchanged
# Acceptable values: Unchanged, Disable, Enable, ForceEnable
AnisotropicFiltering = Unchanged

## [GPU] Maximum LOD bias (lower = simpler meshes sooner). -1 = unchanged.
# Setting type: Single
# Default value: -1
# Acceptable value range: From -1 to 10
LodBiasLimit = -1

## [GPU] Skip the N most detailed LOD levels (0-7). -1 = unchanged.
# Setting type: Int32
# Default value: -1
# Acceptable value range: From -1 to 7
MinimumMaxLodLevel = -1

## [GPU] Maximum per-pixel lights (built-in pipeline) or additional lights per object (URP asset). Kept if the game already uses fewer. -1 = unchanged.
# Setting type: Int32
# Default value: 1
# Acceptable value range: From -1 to 16
PixelLightLimit = 1

## [GPU/VRAM] Minimum texture mip limit: 0 full, 1 half, 2 quarter resolution. Frees VRAM; re-uploads every texture when changed. -1 = unchanged.
# Setting type: Int32
# Default value: -1
# Acceptable value range: From -1 to 3
TextureMipLimit = -1

## [GPU] Realtime reflection probe updates (Off saves GPU time; baked reflections remain).
# Setting type: TriState
# Default value: Off
# Acceptable values: Unchanged, On, Off
RealtimeReflectionProbes = Off

## [GPU] Soft particles (Off avoids depth-texture sampling for particles). Built-in pipeline only; no effect under URP.
# Setting type: TriState
# Default value: Unchanged
# Acceptable values: Unchanged, On, Off
SoftParticles = Unchanged

## [CPU] Maximum particle-collision raycasts per frame (visual only). -1 = unchanged.
# Setting type: Int32
# Default value: -1
# Acceptable value range: From -1 to 4096
ParticleRaycastBudgetLimit = -1

## [CPU/GPU] Upper limit for bones per vertex in skinned meshes.
# Setting type: SkinWeightLimit
# Default value: Unchanged
# Acceptable values: Unchanged, OneBone, TwoBones, FourBones
SkinWeights = Unchanged

## [GPU] HDR rendering on the main camera. Off can reduce colour-buffer bandwidth when HDR is used; no effect if the URP asset already has HDR off; can change the look.
# Setting type: TriState
# Default value: Unchanged
# Acceptable values: Unchanged, On, Off
CameraHdr = Unchanged

## [GPU] Make sure the XR occlusion (hidden-area) mesh is enabled so pixels outside the lenses are not shaded.
# Setting type: Boolean
# Default value: true
EnsureOcclusionMesh = true

## [GPU] The headset view drawn into the desktop window (XR mirror). In Gorilla Tag the game's third-person camera draws over it, so it is only visible while that camera is off (DesktopCamera). LeftEye is cheaper than SideBySide; None makes the window black when the camera is off.
# Setting type: DesktopMirrorMode
# Default value: Unchanged
# Acceptable values: Unchanged, LeftEye, RightEye, SideBySide, None
DesktopMirror = Unchanged

## [GPU/CPU] The game's third-person camera renders the whole scene a second time to the desktop window. OffWhenNotStreaming switches it off unless OBS/Streamlabs records or streams (the window then shows the headset view); Off always. Only while a VR headset is active; rendering only, restored with the profile. Discord screen sharing is not detected: use Unchanged if you share the game window there.
# Setting type: DesktopCameraMode
# Default value: Unchanged
# Acceptable values: Unchanged, OffWhenNotStreaming, Off
DesktopCamera = Unchanged

## [CPU] Milliseconds per frame for background texture/mesh uploads (lower = fewer hitches while maps/cosmetics load, slower loading). -1 = unchanged.
# Setting type: Int32
# Default value: 1
# Acceptable value range: From -1 to 33
AsyncUploadTimeSliceMs = 1

## [CPU] Priority of background asset loading: Unity's time per frame for finishing loads (Low 2 ms, BelowNormal 4 ms, Normal 10 ms, High 50 ms). Lower = smoother frames during loads, slower loads. BelowNormal is Unity's own default on PC and the game does not change it, so in the presets it mostly keeps that value in place.
# Setting type: LoadingPriority
# Default value: BelowNormal
# Acceptable values: Unchanged, Low, BelowNormal, Normal, High
BackgroundLoading = BelowNormal

## [CPU] Incremental GC time slice in ms (only if the game uses incremental GC). Smaller slices = smaller GC spikes, but too small can fall back to full collections. -1 = unchanged.
# Setting type: Single
# Default value: -1
# Acceptable value range: From -1 to 20
IncrementalGcSliceMs = -1

## [Stutter] Do not initialise Shared Blocks until the player enters its zone. (Potassium)
# Setting type: Boolean
# Default value: true
DeferSharedBlocks = true

## [Stutter] Create the remote-player rig pool over several frames instead of all at startup; missing rigs are created on demand. (Potassium)
# Setting type: Boolean
# Default value: true
StaggerRigPool = true

## [Stutter] Remote rigs created immediately when the pool is staggered. (Potassium)
# Setting type: Int32
# Default value: 4
# Acceptable value range: From 1 to 20
InitialRigPoolSize = 4

## [Stutter] Create local scoreboards over successive frames after joining a room. (Potassium)
# Setting type: Boolean
# Default value: true
StaggerScoreboardCreation = true

## [Stutter] Refresh scoreboards one per frame when players join/leave. (Potassium)
# Setting type: Boolean
# Default value: true
StaggerScoreboardRefresh = true

## [Stutter] Skip unused full entity scans done by inactive zones when a player leaves. (Potassium)
# Setting type: Boolean
# Default value: true
SkipInactiveEntityLeaveScans = true

## [Stutter] Forced garbage collection on room leave: GameDefault, Skip (Potassium) or Incremental (time-sliced, only if the game uses incremental GC).
# Setting type: RoomLeaveGcMode
# Default value: Skip
# Acceptable values: GameDefault, Skip, Incremental
RoomLeaveGc = Skip

## [Stutter] Prevent scene components from forcing synchronous unused-asset sweeps during gameplay. May use more memory. (Potassium)
# Setting type: Boolean
# Default value: true
SkipTimedAssetUnloads = true

## [Maps] Custom-map sanitizer optimisation: Off, SafeLookups (keeps the game's rules, only speeds up allow-list lookups; in the current game that is only the layer check, a small saving) or FullReplacement (Potassium's re-implementation; bypasses any rule added by later game updates).
# Setting type: SanitizerMode
# Default value: SafeLookups
# Acceptable values: Off, SafeLookups, FullReplacement
MapSanitizer = SafeLookups

## [Visual] Texture-transition updates per second (0 = game rate). (Potassium, frame-staggered)
# Setting type: Single
# Default value: 24
# Acceptable value range: From 0 to 240
TextureTransitionRate = 24

## [Visual] Voice-reactive cosmetic updates per second when they use no smoothing (0 = game rate). (Potassium, frame-staggered)
# Setting type: Single
# Default value: 24
# Acceptable value range: From 0 to 240
VoiceVisualRate = 24

## [Visual] Cosmetic environment-proximity checks per second (0 = game rate). (Potassium, frame-staggered)
# Setting type: Single
# Default value: 24
# Acceptable value range: From 0 to 240
ProximityRate = 24

## [Visual] Locally cull distant remote-player cosmetics. Does not affect networking or what others see. (Potassium)
# Setting type: Boolean
# Default value: true
ReduceDistantCosmetics = true

## [Visual] Distance (m) within which remote cosmetics are always drawn. (Potassium)
# Setting type: Single
# Default value: 4.5
# Acceptable value range: From 0 to 100
CosmeticFullDetailDistance = 4.5

## [Visual] Maximum distance (m) for remote cosmetics. (Potassium)
# Setting type: Single
# Default value: 8
# Acceptable value range: From 0 to 200
CosmeticMaximumDistance = 8

## [Visual] Players always drawn with full cosmetics. (Potassium)
# Setting type: Int32
# Default value: 5
# Acceptable value range: From 0 to 20
CosmeticFullDetailCount = 5

## [Visual] Maximum players drawn with cosmetics. (Potassium)
# Setting type: Int32
# Default value: 10
# Acceptable value range: From 0 to 20
CosmeticMaximumCount = 10

## [Adaptive] Allow adaptive mode to change render scale while this profile is active.
# Setting type: Boolean
# Default value: false
AdaptiveMayChangeRenderScale = false

## [Adaptive] Allow adaptive mode to change shadow distance and pixel lights.
# Setting type: Boolean
# Default value: true
AdaptiveMayChangeShadows = true

## [Adaptive] Allow adaptive mode to change LOD bias.
# Setting type: Boolean
# Default value: true
AdaptiveMayChangeLod = true

## [Adaptive] Allow adaptive mode to reduce distant remote-player cosmetic detail and cosmetic update rates (CPU savings in busy lobbies).
# Setting type: Boolean
# Default value: true
AdaptiveMayChangeCosmetics = true

## [Adaptive] Share of the frame budget to keep free on the GPU (for video encoders/compositor). Only used when the VR runtime reports GPU time.
# Setting type: Single
# Default value: 20
# Acceptable value range: From 0 to 40
AdaptiveGpuHeadroomPercent = 20

