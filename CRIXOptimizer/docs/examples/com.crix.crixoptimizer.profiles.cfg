[Balanced]

## [GPU] VR eye-texture resolution scale (0 = leave the game/runtime value; 0.5-2.0 = set). Under URP it is set through the URP asset's render scale, which URP ignores within 0.05 of 1.0. Recreates eye textures when changed (brief hitch).
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 2
RenderScale = 0

## [GPU] Upper limit for the pixels CRIX lets the game render per eye, in megapixels (0 = no limit). VR runtimes set the eye resolution (Virtual Desktop's quality preset, Meta Quest Link's render resolution, SteamVR's slider); when that is far above what the GPU can draw, CRIX lowers the game's render scale until one eye is at most this many megapixels (a Quest 3 at default settings renders about 4.6 MP per eye). Under URP this also sets the desktop window's resolution, so streaming profiles leave it off.
# Setting type: Single
# Default value: 8
# Acceptable value range: From 0 to 50
MaxEyeMegapixels = 8

## [GPU] Upper limit for shadow quality (built-in pipeline). HardOnly removes soft-shadow filtering, Disable turns realtime shadows off.
# Setting type: ShadowQualityLimit
# Default value: Unchanged
# Acceptable values: Unchanged, HardOnly, Disable
ShadowQuality = Unchanged

## [GPU] Maximum realtime shadow distance in metres; kept if the game already uses less. -1 = unchanged.
# Setting type: Single
# Default value: 50
# Acceptable value range: From -1 to 1000
ShadowDistanceLimit = 50

## [GPU] Upper limit for shadow-map resolution (built-in pipeline only; no effect under URP).
# Setting type: ShadowResolutionLimit
# Default value: Unchanged
# Acceptable values: Unchanged, Low, Medium, High
ShadowResolution = Unchanged

## [GPU] Maximum shadow cascades (1, 2 or 4; built-in pipeline or URP asset). Kept if the game already uses fewer. -1 = unchanged.
# Setting type: Int32
# Default value: 2
# Acceptable value range: From -1 to 4
ShadowCascadesLimit = 2

## [GPU] MSAA samples (0, 2, 4, 8). -1 = unchanged. A cap on both pipelines (never raised). Under URP it applies at once and reallocates the eye textures (brief hitch); with the built-in pipeline some VR runtimes only pick it up after a restart. The dashboard shows the eye-texture MSAA in use.
# Setting type: Int32
# Default value: -1
# Acceptable value range: From -1 to 8
MsaaSamples = -1

## [GPU] Anisotropic texture filtering mode.
# Setting type: AnisotropicMode
# Default value: Unchanged
# Acceptable values: Unchanged, Disable, Enable, ForceEnable
AnisotropicFiltering = Unchanged

## [GPU] Maximum LOD bias (lower = simpler meshes sooner). -1 = unchanged.
# Setting type: Single
# Default value: -1
# Acceptable value range: From -1 to 10
LodBiasLimit = -1

## [GPU] Skip the N most detailed LOD levels (0-7). -1 = unchanged.
