[Adaptive]

## Adaptive quality: lowers (and later restores) shadow distance, LOD bias, pixel lights and render scale to hold the target frame rate. Never touches gameplay, physics or networking.
# Setting type: Boolean
# Default value: false
Enabled = false

## Target frame rate. 0 = headset refresh rate reported by the VR runtime (desktop: monitor refresh).
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 360
TargetFps = 0

## 0 = react only to large drops, 1 = react to small drops.
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 1
Sensitivity = 0.5

## Lowest quality level adaptive mode may use (0 = profile baseline, -10 = most reduced).
# Setting type: Int32
# Default value: -6
# Acceptable value range: From -10 to 0
MinimumQualityLevel = -6

## Highest level. Above 0 adaptive mode may raise render scale above the profile when there is headroom.
# Setting type: Int32
# Default value: 0
# Acceptable value range: From 0 to 3
MaximumQualityLevel = 0

## Render-scale change per step.
# Setting type: Single
# Default value: 0.1
# Acceptable value range: From 0.05 to 0.25
RenderScaleStep = 0.1

## Adaptive mode never lowers render scale below this.
# Setting type: Single
# Default value: 0.6
# Acceptable value range: From 0.5 to 1
MinimumRenderScale = 0.6

## Adaptive mode never raises render scale above this.
# Setting type: Single
# Default value: 1.3
# Acceptable value range: From 1 to 2
MaximumRenderScale = 1.3

## Minimum time between two adjustments.
# Setting type: Single
# Default value: 8
# Acceptable value range: From 2 to 120
CooldownSeconds = 8

## How long the frame rate must stay below target before quality is lowered.
# Setting type: Single
# Default value: 2
# Acceptable value range: From 0.5 to 30
DownSustainSeconds = 2

## How long performance must be comfortably on target before quality is raised again.
# Setting type: Single
# Default value: 20
# Acceptable value range: From 5 to 300
UpSustainSeconds = 20

## Hold the quality level at ManualLevel instead of adapting.
# Setting type: Boolean
# Default value: false
ManualOverride = false

## Level used when ManualOverride is true.
# Setting type: Int32
# Default value: 0
# Acceptable value range: From -10 to 3
ManualLevel = 0

