## Cameras that render into a texture (minimaps, tablets, spectator displays from mods such as Sakuraa Client) draw the whole scene again every frame. A value above 0 lets each of them render at most this many times per second; between updates their screen keeps the last image. 0 = off (default). This changes other mods' cameras, so it is only active when you set it. Mirrors, the game's LIV camera and the photo booth are excluded (ExtraCameraExclude).
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 144
ExtraCameraMaxFps = 0

## Comma-separated name fragments of render-texture cameras ExtraCameraMaxFps never limits (case-insensitive). Add a camera's name here if it must update every frame, e.g. one whose image you stream.
# Setting type: String
# Default value: mirror,lck,photo,reflection,portal
ExtraCameraExclude = mirror,lck,photo,reflection,portal

## The desktop spectator view (the game's third-person 'Shoulder Camera', which Sakuraa Client uses as its spectator camera) renders the scene at most this many times per second (about 5 % more at most, from rounding to whole headset frames); the headset keeps its full rate, and the game window is drawn every frame with the camera's latest image, so it does not flicker. At 60 on a 120 Hz headset it renders on every 2nd frame: about half of that camera's CPU work. The VR render scale may not apply to it any more (it can render at the full window size: sharper, more GPU work per render). A 60 fps recording samples the window on its own clock, so a frame may repeat now and then. 0 = off (default). It points that camera at a texture of CRIX's, so it is only active when you set it. Experimental: not tested in Gorilla Tag yet.
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 144
SpectatorCameraMaxFps = 0

## EvenFrames: renders every Nth headset frame (120 Hz -> 60/s, 90 Hz -> 45/s, 144 Hz -> 48/s): evenly spaced, never two heavy frames in a row. ExactRate: keeps the exact rate, but the spacing is uneven when the refresh rate is not a multiple of it (90 Hz and 60/s: 1, 2, 1, 2 frames).
# Setting type: SpectatorCadence
# Default value: EvenFrames
# Acceptable values: EvenFrames, ExactRate
