ObsProfile = OBSStreaming

## Profile used while Discord is active (and OBS is not).
# Setting type: ProfileKind
# Default value: DiscordCall
# Acceptable values: Balanced, MaximumPerformance, HighRefresh, VirtualDesktop, OBSStreaming, DiscordCall, ReShadeCompatible, MultiMod, Custom
DiscordProfile = DiscordCall

## Keep the streaming profile this long after the last streaming signal, so a short reconnect does not flip profiles.
# Setting type: Single
# Default value: 20
# Acceptable value range: From 0 to 600
HoldSeconds = 20

## Read whether OBS is live or recording through OBS's built-in WebSocket server (OBS 28+, Tools > WebSocket Server Settings > Enable WebSocket server). Read-only: CRIX only asks for the streaming/recording state and can never start, stop or change anything in OBS. Connects to 127.0.0.1 only.
# Setting type: Boolean
# Default value: true
ObsWebSocket = true

## Port of the OBS WebSocket server (OBS default 4455).
# Setting type: Int32
# Default value: 4455
# Acceptable value range: From 1 to 65535
ObsWebSocketPort = 4455

## Password from OBS (Tools > WebSocket Server Settings > Show Connect Info). Leave empty if authentication is off in OBS. Stored in plain text in this file and never written to the log. Not shown in in-game config editors, because those draw on the window OBS records.
# Setting type: String
# Default value: 
ObsWebSocketPassword = 

## While Streamlabs Desktop runs, read whether it is live or recording from its local API (127.0.0.1:28194, no setup, read-only: only StreamingService.getModel is called).
# Setting type: Boolean
# Default value: true
StreamlabsApi = true

